<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">

<style>
body {

    font-family: Arial, sans-serif;

    border-top: 2px dashed #071952;
    margin: 20px 0;
}

    font-size: 28px;

</head>

<body>

<div class="container">

<h1>🎫 جواز الإياب</h1>

<p class="subtitle">
رحلة جديدة... وموعد جديد مع الانتصار 🇰🇼
</p>

<div class="card">

<h2>⚽ مباراة الإياب</h2>

<div class="match">
🇰🇼 الكويت × روسيا 🇷🇺
</div>

<div class="info">
🕘 9:00 مساءً
</div>

<input
    type="text"
    id="name"
    placeholder="اكتب اسمك هنا"
    maxlength="50"
>

<br>

<button id="registerButton" onclick="registerAttendance()">
🎟️ سجّل حضورك
</button>

<div id="status">
لم تسجل أي حضور حتى الآن.
</div>

<div id="counter">
👥 عدد المسجلين: ...
</div>

<div class="ticket">

<div class="ticket-top">
<span>🇰🇼</span>
<strong>جواز الإياب</strong>
<span>🎫</span>
</div>

<div class="ticket-line"></div>

<h2>🏆 تذكرتك</h2>

<p class="ticket-match">
الكويت 🇰🇼 × روسيا 🇷🇺
</p>

<p>🕘 9:00 مساءً</p>

<p class="ticket-note">
نتمنى لك تجربة لا تُنسى ❤️
</p>

</div>

</div>

</div>


<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    serverTimestamp,
    getCountFromServer
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig = {
    apiKey: "AIzaSyAXCJeK9_FAd6lR0ctfdm_kcaVI-ys52dw",
    authDomain: "return-ticket.firebaseapp.com",
    projectId: "return-ticket",
    storageBucket: "return-ticket.firebasestorage.app",
    messagingSenderId: "714749786440",
    appId: "1:714749786440:web:8a554f291bba83acdf5b7d",
    measurementId: "G-HL7MCWQQZS"
};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


async function updateCounter() {

    try {

        const participantsRef =
            collection(db, "participants");

        const snapshot =
            await getCountFromServer(participantsRef);

        document.getElementById("counter").innerText =
            "👥 عدد المسجلين: " +
            snapshot.data().count;

    } catch (error) {

        console.error(error);

        document.getElementById("counter").innerText =
            "👥 عدد المسجلين: غير متاح حاليًا";
    }
}


window.registerAttendance = async function() {

    const nameInput =
        document.getElementById("name");

    const button =
        document.getElementById("registerButton");

    const status =
        document.getElementById("status");

    const name =
        nameInput.value.trim();


    if (!name) {

        status.innerHTML =
            "⚠️ اكتبي اسمك أولًا ❤️";

        return;
    }


    button.disabled = true;

    status.innerHTML =
        "⏳ جارٍ تسجيل حضورك...";


    try {

        await addDoc(
            collection(db, "participants"),
            {
                name: name,
                createdAt: serverTimestamp()
            }
        );


        status.innerHTML =
            "✅ تم تسجيل حضورك يا " +
            name +
            "!<br>🇰🇼 ننتظرك في المدرجات!";


        nameInput.value = "";

        await updateCounter();


    } catch (error) {

        console.error(error);

        status.innerHTML =
            "❌ ما قدرنا نسجل حضورك الآن.<br>حاولي مرة ثانية.";

    } finally {

        button.disabled = false;
    }
};


updateCounter();

</script>

</body>
</html>
