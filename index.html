<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>جواز الإياب</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #071952, #0B666A);
    color: white;
    text-align: center;
    min-height: 100vh;
    padding: 40px 20px;
}

.container {
    max-width: 600px;
    margin: auto;
}

h1 {
    font-size: 42px;
    margin-bottom: 10px;
}

.subtitle {
    font-size: 20px;
    opacity: 0.9;
}

.card {
    background: rgba(255,255,255,0.12);
    border-radius: 25px;
    padding: 30px 20px;
    margin-top: 30px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
}

.match {
    font-size: 28px;
    font-weight: bold;
    margin: 20px 0;
}

.info {
    font-size: 19px;
    margin: 10px 0;
}

button {
    background: white;
    color: #071952;
    border: none;
    border-radius: 15px;
    padding: 15px 30px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 20px;
}

button:hover {
    transform: scale(1.05);
}

#status {
    font-size: 18px;
    margin-top: 15px;
}

.ticket {
    margin-top: 35px;
    padding: 25px 20px;
    background: white;
    color: #071952;
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.3);
}

.ticket-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 24px;
}

.ticket-line {
    border-top: 2px dashed #071952;
    margin: 20px 0;
}

.ticket h2 {
    font-size: 28px;
    margin: 10px 0;
}

.ticket-match {
    font-size: 22px;
    font-weight: bold;
}

.ticket-note {
    opacity: 0.7;
    margin-bottom: 0;
}
</style>

</head>

<body>

<div class="container">

<h1>🎫 جواز الإياب</h1>

<p class="subtitle">رحلة جديدة... وموعد جديد مع الانتصار 🇰🇼</p>

<div class="card">

<h2>⚽ مباراة الإياب</h2>

<div class="match">
🇰🇼 الكويت × روسيا 🇷🇺
</div>

<div class="info">🕘 9:00 مساءً</div>

<button onclick="registerAttendance()">
🎟️ سجّل حضورك
</button>

<div id="status">
لم تسجل أي حضور حتى الآن.
</div>

<div class="ticket">

<div class="ticket-top">
<span>🇰🇼</span>
<strong>جواز الإياب</strong>
<span>🎫</span>
</div>

<div class="ticket-line"></div>

<h2>🏆 تذكرتك</h2>

<p class="ticket-match">
الكويت 🇰🇼 × روسيا 🇷🇺
</p>

<p>🕘 9:00 مساءً</p>

<p class="ticket-note">
نتمنى لك تجربة لا تُنسى ❤️
</p>

</div>

</div>

</div>

<script>
function registerAttendance() {
    document.getElementById("status").innerHTML =
    "✅ تم تسجيل حضورك!<br>🇰🇼 ننتظرك في المدرجات!";
}
</script>

</body>
</html>
